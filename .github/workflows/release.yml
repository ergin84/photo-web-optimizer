name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: PhotoWebOptimizer-linux-x64
          - os: windows-latest
            asset: PhotoWebOptimizer-windows-x64.exe
          - os: macos-latest
            asset: PhotoWebOptimizer-macos.zip
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-build.txt

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Build executable
        run: python build.py

      - name: Package Linux binary
        if: matrix.os == 'ubuntu-latest'
        run: mv dist/PhotoWebOptimizer dist/PhotoWebOptimizer-linux-x64

      - name: Package Windows binary
        if: matrix.os == 'windows-latest'
        shell: bash
        run: mv dist/PhotoWebOptimizer.exe dist/PhotoWebOptimizer-windows-x64.exe

      - name: Package macOS .app into zip
        if: matrix.os == 'macos-latest'
        run: |
          cd dist
          # Rimuovi l'eseguibile standalone, teniamo solo il bundle .app
          rm -f PhotoWebOptimizer
          zip -r PhotoWebOptimizer-macos.zip PhotoWebOptimizer.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: false
